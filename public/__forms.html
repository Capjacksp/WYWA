<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>WYWA Forms</title>
  </head>
  <body>
    <form name="connect" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="connect" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="organization" />
      <input name="inquiryType" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
